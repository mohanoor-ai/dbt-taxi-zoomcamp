version: 2

sources:
  - name: staging
    database: dataeng-proj-487214 
    schema: nytaxi
    tables:
      - name: green_tripdata
      - name: yellow_tripdata

models:
  - name: stg_green_tripdata
    description: "Staged data for Green Taxis"
    columns:
      - name: tripid
        description: "Primary key generated by surrogate key macro"
        tests:
          - unique
          - not_null
      - name: vendorid
        tests:
          - not_null

  - name: stg_yellow_tripdata
    description: "Staged data for Yellow Taxis"
    columns:
      - name: tripid
        description: "Primary key generated by surrogate key macro"
        tests:
          - unique
          - not_null
      - name: payment_type
        description: "Payment method used"
        tests:
          - accepted_values:
              arguments:   # Required for dbt-fusion 2.0
                values: [1, 2, 3, 4, 5, 6]